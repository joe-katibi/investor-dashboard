; Supervisor programs for the Outage Management System.
;
; Install:
;   sudo cp deploy/supervisor/oms.conf /etc/supervisor/conf.d/oms.conf
;   (edit APP_DIR / user below if your path or web-server user differ)
;   sudo supervisorctl reread && sudo supervisorctl update
;
; Run as the same user as PHP-FPM / the web server (www-data on Ubuntu) so files in
; storage/ are always writable by both.

[program:oms-queue]
command=php /home/nms/www/outagemangementsystem/artisan queue:work --queue=default,notifications,reports --sleep=3 --tries=3 --timeout=90 --max-time=3600
directory=/home/nms/www/outagemangementsystem
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/home/nms/www/outagemangementsystem/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:oms-reverb]
command=php /home/nms/www/outagemangementsystem/artisan reverb:start
directory=/home/nms/www/outagemangementsystem
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/home/nms/www/outagemangementsystem/storage/logs/reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
