# Investor dashboard on https://ops.savannacrm.co.ug:5303 — server 10.32.28.32, app in /home/nms/www/investor-dashboard
# /etc/nginx/sites-available/investor-dashboard.conf  (linked into sites-enabled)
#
# Uses the company's *.savannacrm.co.ug wildcard certificate — the same files as the OMS and KPI dashboard
# sites on this server (sudo grep -R "ssl_certificate" /etc/nginx/sites-enabled/).

server {
    # "ssl http2" on the listen line works on every nginx (Ubuntu 24.04 ships 1.24, which has no "http2 on;").
    listen 5303 ssl http2;
    listen [::]:5303 ssl http2;
    server_name ops.savannacrm.co.ug;

    ssl_certificate     /etc/ssl/savannacrm.co.ug.fullchain.crt;
    ssl_certificate_key /etc/ssl/private/savannacrm.co.ug.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:investor_ssl:10m;
    ssl_session_timeout 1d;

    # A plain-HTTP request to this port gets a redirect to HTTPS instead of nginx's 400 page.
    error_page 497 =301 https://$host:5303$request_uri;

    root /home/nms/www/investor-dashboard/public;
    index index.php;
    charset utf-8;
    client_max_body_size 64M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 5303;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/investor-dashboard.access.log;
    error_log  /var/log/nginx/investor-dashboard.error.log;
}
